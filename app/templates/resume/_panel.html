<h2 class="section-title">{{ selected_category }}</h2>
<div class="stat-line">
    <span class="stat"><strong data-count-to="{{ modules | length }}">0</strong> 个模块</span>
</div>
<div class="module-cards">
    {% for module in modules %}
    {% include "resume/_module_card.html" %}
    {% endfor %}
    {% if not modules %}
    <div class="empty-state">这个分类下还没有模块</div>
    {% endif %}
</div>

<div class="row-card">
    <form class="stack" hx-post="/resume/modules" hx-target="#resume-panel" hx-swap="innerHTML">
        <input type="hidden" name="category" value="{{ selected_category }}">
        <input type="text" name="title" placeholder="模块标题（可选）">
        <textarea name="content" placeholder="粘贴简历内容" required></textarea>
        <div><button type="submit">新增模块</button></div>
    </form>
</div>
