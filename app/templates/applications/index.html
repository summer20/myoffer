{% extends "base.html" %}
{% block content %}
<div class="page-hero">
    <span class="page-eyebrow">Application board</span>
    <h1 class="page-title">你的<span class="accent">投递进度</span>一览无余</h1>
    <p class="page-subtitle">按阶段筛选，点一下下拉框就能更新面试进展。</p>
    <div class="stat-line">
        <span class="stat"><strong data-count-to="{{ applications | length }}">0</strong> 条投递</span>
        <span class="stat"><strong data-count-to="{{ applications | selectattr('stage', 'equalto', 'offer') | list | length }}">0</strong> 个 offer</span>
    </div>
</div>

<section class="block">
    <form class="filters" hx-get="/applications" hx-target="body" hx-push-url="true">
        <select name="stage">
            <option value="">全部阶段</option>
            {% for opt in stage_options %}
            <option value="{{ opt }}" {% if opt == selected_stage %}selected{% endif %}>{{ opt }}</option>
            {% endfor %}
        </select>
        <button type="submit">筛选</button>
    </form>

    <div class="card-list" id="application-rows">
        {% if applications %}
            {% for application in applications %}
                {% include "applications/_row.html" %}
            {% endfor %}
        {% else %}
            <div class="empty-state">还没有投递记录 — 去公司库添加第一条吧</div>
        {% endif %}
    </div>
</section>
{% endblock %}
